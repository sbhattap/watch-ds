[project]
name = "sleepwear"
version = "0.1.0"
description = "Sleep staging from Apple Watch accelerometer and heart rate, scored against PSG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleepwear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
